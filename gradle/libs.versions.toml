[versions]
clikt = "5.0.3"
exposed = "1.0.0-rc-4"
graalvm = "0.11.3"
h2 = "2.2.224"
kotest = "6.0.7"
ktlint = "12.2.0"
logback = "1.5.21"
mockk = "1.14.6"
mordant = "3.0.2"

[libraries]
clikt-core = { module = "com.github.ajalt.clikt:clikt-core-jvm", version.ref = "clikt" }
clikt-jvm = { module = "com.github.ajalt.clikt:clikt-jvm", version.ref = "clikt" }
clikt-markdown = { module = "com.github.ajalt.clikt:clikt-markdown-jvm", version.ref = "clikt" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
guava = { module = "com.google.guava:guava", version = "33.5.0-jre" }
guice = { module = "com.google.inject:guice", version = "7.0.0" }
guice-testlib = { module = "com.google.inject.extensions:guice-testlib", version = "7.0.0" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
kotest = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest"}
kotest-jvm = { module = "io.kotest:kotest-framework-engine-jvm", version.ref = "kotest"}
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest"}
kotest-assertions-jvm = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest"}
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
mockk-jvm = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
mockk-dsl-jvm = { module = "io.mockk:mockk-dsl-jvm", version.ref = "mockk" }
mordant-core = { module = "com.github.ajalt.mordant:mordant-core-jvm", version.ref = "mordant" }
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.17" }

[plugins]
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
